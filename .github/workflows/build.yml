name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: '8.5'}
      - name: Create Android project
        run: |
          P=proj/app/src/main
          mkdir -p $P/assets $P/java/com/mayur/spectrastudio $P/res/values $P/res/mipmap-xxxhdpi
          cp index.html $P/assets/index.html
          convert icon.png -resize 192x192 $P/res/mipmap-xxxhdpi/ic_launcher.png || cp icon.png $P/res/mipmap-xxxhdpi/ic_launcher.png
          cd proj
          printf "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositories{google();mavenCentral()}}\nrootProject.name='SpectraStudio'\ninclude ':app'\n" > settings.gradle
          printf "plugins{id 'com.android.application' version '8.2.2' apply false}\n" > build.gradle
          printf "org.gradle.jvmargs=-Xmx2g\nandroid.nonTransitiveRClass=true\n" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins{id 'com.android.application'}
          android{
           namespace 'com.mayur.spectrastudio'
           compileSdk 34
           defaultConfig{applicationId 'com.mayur.spectrastudio';minSdk 29;targetSdk 34;versionCode 1;versionName '1.0'}
           compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Spectra Studio" android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:allowBackup="false" android:hardwareAccelerated="true">
            <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:Theme.Material.NoActionBar">
           <item name="android:windowBackground">#0d0f14</item><item name="android:statusBarColor">#0d0f14</item><item name="android:navigationBarColor">#0d0f14</item>
          </style></resources>
          EOF
          cat > app/src/main/java/com/mayur/spectrastudio/MainActivity.java <<'EOF'
          package com.mayur.spectrastudio;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.OutputStream;
          public class MainActivity extends Activity {
           WebView wv; ValueCallback<Uri[]> cb; OutputStream out; String saved = "";
           @Override protected void onCreate(Bundle b) {
            super.onCreate(b);
            getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            wv = new WebView(this); setContentView(wv);
            WebSettings s = wv.getSettings();
            s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true);
            s.setMediaPlaybackRequiresUserGesture(false);
            wv.addJavascriptInterface(new Bridge(), "AndroidBridge");
            wv.setWebChromeClient(new WebChromeClient() {
             @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> c, FileChooserParams p) {
              if (cb != null) cb.onReceiveValue(null);
              cb = c;
              Intent i = new Intent(Intent.ACTION_GET_CONTENT);
              i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("*/*");
              String[] t = p.getAcceptTypes();
              if (t != null && t.length > 0 && t[0] != null && !t[0].isEmpty()) i.putExtra(Intent.EXTRA_MIME_TYPES, t);
              try { startActivityForResult(i, 1); } catch (Exception e) { cb = null; return false; }
              return true;
             }
            });
            wv.loadUrl("file:///android_asset/index.html");
           }
           @Override protected void onActivityResult(int req, int res, Intent d) {
            if (req == 1 && cb != null) { cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, d)); cb = null; }
           }
           class Bridge {
            @JavascriptInterface public void begin(String name) {
             try {
              String mime = name.endsWith(".mp4") ? "video/mp4" : name.endsWith(".webm") ? "video/webm" : "audio/wav";
              ContentValues v = new ContentValues();
              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/SpectraStudio");
              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
              out = getContentResolver().openOutputStream(u); saved = name;
             } catch (Exception e) { out = null; toast("Could not save: " + e.getMessage()); }
            }
            @JavascriptInterface public void chunk(String b64) {
             try { if (out != null) out.write(Base64.decode(b64, Base64.DEFAULT)); } catch (Exception e) { toast("Save error: " + e.getMessage()); }
            }
            @JavascriptInterface public void end() {
             try { if (out != null) { out.close(); out = null; toast("Saved to Downloads/SpectraStudio/" + saved); } } catch (Exception e) { toast("Save error"); }
            }
           }
           void toast(String m) { runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_LONG).show()); }
          }
          EOF
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpectraStudio-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
